name: Publish to Crates.io

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.27)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish upstream crate only
    # Forks must choose their own crate name and review publishing credentials
    # before enabling registry publication. Never publish fork code as upstream.
    if: >-
      github.repository == 'mesamirh/MovieBox-Tui' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Determine ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid release tag"
              exit 1
            fi
            REF="$REQUESTED_TAG"
          else
            if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid release commit"
              exit 1
            fi
            REF="$RELEASE_SHA"
          fi
          echo "target_ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.ref.outputs.target_ref }}
          persist-credentials: false

      - name: Confirm released version
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "v$VERSION" != "$REQUESTED_TAG" ]]; then
            echo "::error::Requested tag does not match Cargo.toml"
            exit 1
          fi
          gh release view "v$VERSION" --repo "$REPOSITORY" --json id >/dev/null
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 30 -H 'User-Agent: moviebox-release' \
            "https://crates.io/api/v1/crates/moviebox-tui/$VERSION")
          case "$STATUS" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Registry lookup failed ($STATUS)"; exit 1 ;;
          esac

      - name: Install Rust
        if: steps.gate.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Publish to crates.io
        if: steps.gate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
